service_id: wordpress
service_name: wordpress
service_unit_name: wordpress
service_image: docker.io/library/wordpress:6.5.5-php8.2-apache
version: "6.5.5"
service_ip: "{{ wordpress_container_ip }}"
service_ports:
  - target: 80
    published: {{ wordpress_service_port }}
    protocol: tcp
service_env:
  - name: WORDPRESS_DB_HOST
    value: "{{ wordpress_db_host }}"
  - name: WORDPRESS_DB_NAME
    value: "{{ wordpress_db_name }}"
  - name: WORDPRESS_DB_USER
    value: "{{ wordpress_db_user }}"
  - name: WORDPRESS_TABLE_PREFIX
    value: "{{ wordpress_db_table_prefix }}"
  - name: WORDPRESS_CONFIG_EXTRA
    value: "{{ wordpress_config_extra }}"
service_volumes:
  - name: data
    source: "{{ wordpress_data_volume }}"
    target: /var/www/html
    driver: local
    size: "{{ wordpress_container_storage_gb }}Gi"
service_resources:
  memory_mb: "{{ wordpress_container_memory_mb }}"
  cpu_cores: "{{ wordpress_container_cpu_cores }}"
service_namespace: "{{ wordpress_kubernetes_namespace }}"
service_replicas: "{{ wordpress_kubernetes_replicas }}"
service_packages:
  - apache2
  - php
  - php-mysql
service_services:
  - name: apache2
    enabled: true
    state: started
service_container:
  vmid: "{{ wordpress_container_vmid }}"
  hostname: "{{ service_name }}"
  ostemplate: "{{ wordpress_container_template }}"
  disk: "{{ wordpress_container_storage_gb }}"
  cores: "{{ wordpress_container_cpu_cores }}"
  memory: "{{ wordpress_container_memory_mb }}"
  swap: "{{ wordpress_container_swap_mb }}"
  bridge: "{{ wordpress_container_bridge }}"
  cidr: "{{ wordpress_container_cidr }}"
  gateway: "{{ wordpress_container_gateway }}"
  interface: "{{ wordpress_container_interface }}"
  onboot: yes
  unprivileged: yes
  features: nesting=1,keyctl=1
requires:
  - mariadb
exports:
  env:
    - name: WORDPRESS_URL
      value: "{{ wordpress_site_url }}"
    - name: WORDPRESS_PORT
      value: "{{ wordpress_service_port | string }}"
storage:
  - name: data
    path: /var/www/html
    size: "{{ wordpress_container_storage_gb }}G"
health:
  cmd:
    - curl
    - -fsS
    - "http://127.0.0.1:{{ wordpress_service_port }}/wp-login.php"
  interval: 15s
  timeout: 10s
  retries: 5
runtime_templates:
  proxmox: proxmox.yml.j2
  docker: docker.yml.j2
  podman: podman.yml.j2
  kubernetes: kubernetes.yml.j2
  baremetal: baremetal.yml.j2
secrets:
  env:
    - name: WORDPRESS_DB_PASSWORD
      value: "{{ wordpress_db_password }}"

wordpress_service_port: 8080
wordpress_data_volume: wordpress-data
wordpress_container_vmid: 210
wordpress_container_ip: 192.168.100.12
wordpress_container_gateway: 192.168.100.1
wordpress_container_cidr: 24
wordpress_container_bridge: vmbr0
wordpress_container_interface: eth0
wordpress_container_cpu_cores: 2
wordpress_container_memory_mb: 1024
wordpress_container_swap_mb: 1024
wordpress_container_storage_gb: 20
wordpress_container_template: local:vztmpl/ubuntu-24.04-standard_24.04-2_amd64.tar.zst
wordpress_kubernetes_namespace: apps
wordpress_kubernetes_replicas: 1
wordpress_db_host: "{{ lookup('env', 'WORDPRESS_DB_HOST') | default('mariadb:3306') }}"
wordpress_db_name: "{{ lookup('env', 'WORDPRESS_DB_NAME') | default('appdb') }}"
wordpress_db_user: "{{ lookup('env', 'WORDPRESS_DB_USER') | default('app') }}"
wordpress_db_password: "{{ lookup('env', 'WORDPRESS_DB_PASSWORD') | default('change-me-wp-db', true) }}"
wordpress_db_table_prefix: "{{ lookup('env', 'WORDPRESS_TABLE_PREFIX') | default('wp_', true) }}"
wordpress_config_extra: "{{ lookup('env', 'WORDPRESS_CONFIG_EXTRA') | default('', true) }}"
wordpress_site_url: "{{ lookup('env', 'WORDPRESS_URL') | default('http://localhost:8080', true) }}"
